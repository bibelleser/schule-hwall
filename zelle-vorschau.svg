<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
  <title>Pflanzenzelle und Tierzelle im Vergleich</title>
  <rect width="600" height="400" fill="#eaf4eb"/>

  <!-- Pflanzenzelle -->
  <g transform="translate(40,60)">
    <rect x="0" y="0" width="240" height="250" rx="14" fill="#9fd08a" stroke="#3f7d34" stroke-width="10"/>
    <rect x="9" y="9" width="222" height="232" rx="9" fill="#e4f5d6" stroke="#6aa85a" stroke-width="2"/>
    <!-- Vakuole -->
    <path d="M40 60 Q120 30 190 70 Q215 140 175 200 Q110 225 55 190 Q25 130 40 60Z" fill="#bfe3f2" stroke="#5a9fc0" stroke-width="2.5"/>
    <!-- Zellkern -->
    <circle cx="190" cy="205" r="24" fill="#c9a6e0" stroke="#7d4fa0" stroke-width="2.5"/>
    <circle cx="194" cy="202" r="8" fill="#8a5bb0"/>
    <!-- Chloroplasten -->
    <g fill="#3f9a3a" stroke="#22621f" stroke-width="2">
      <ellipse cx="32" cy="35" rx="16" ry="9" transform="rotate(-20 32 35)"/>
      <ellipse cx="210" cy="35" rx="16" ry="9" transform="rotate(25 210 35)"/>
      <ellipse cx="28" cy="215" rx="16" ry="9" transform="rotate(15 28 215)"/>
      <ellipse cx="120" cy="222" rx="16" ry="9"/>
      <ellipse cx="212" cy="120" rx="9" ry="16"/>
    </g>
    <!-- Mitochondrium -->
    <ellipse cx="120" cy="20" rx="14" ry="7" fill="#f2a65a" stroke="#b86b24" stroke-width="2"/>
  </g>
  <text x="160" y="355" text-anchor="middle" font-size="24" font-weight="700" fill="#24313a">Pflanzenzelle</text>

  <!-- Tierzelle -->
  <g transform="translate(440,185)">
    <path d="M0 -120 C70 -125 125 -70 118 0 C125 75 60 125 -5 118 C-75 122 -125 65 -118 -5 C-122 -75 -65 -118 0 -120Z" fill="#fde3d8" stroke="#d27a5f" stroke-width="4"/>
    <!-- Zellkern -->
    <circle cx="5" cy="0" r="38" fill="#c9a6e0" stroke="#7d4fa0" stroke-width="2.5"/>
    <circle cx="12" cy="-5" r="12" fill="#8a5bb0"/>
    <!-- Mitochondrien -->
    <g fill="#f2a65a" stroke="#b86b24" stroke-width="2">
      <ellipse cx="-65" cy="-50" rx="20" ry="10" transform="rotate(-30 -65 -50)"/>
      <ellipse cx="70" cy="55" rx="20" ry="10" transform="rotate(20 70 55)"/>
      <ellipse cx="-55" cy="65" rx="20" ry="10" transform="rotate(35 -55 65)"/>
    </g>
    <g fill="none" stroke="#b86b24" stroke-width="1.5">
      <path d="M-78 -45 l6 -8 l6 8 l6 -8 l6 8" transform="rotate(-30 -65 -50)"/>
      <path d="M57 58 l6 -8 l6 8 l6 -8 l6 8" transform="rotate(20 70 55)"/>
    </g>
    <!-- Ribosomen / ER-Punkte -->
    <g fill="#d27a5f">
      <circle cx="60" cy="-60" r="4"/><circle cx="75" cy="-45" r="4"/><circle cx="85" cy="-25" r="4"/>
      <circle cx="-85" cy="10" r="4"/><circle cx="-80" cy="28" r="4"/><circle cx="10" cy="85" r="4"/>
    </g>
    <path d="M45 -85 Q70 -75 80 -60" fill="none" stroke="#e0a090" stroke-width="5" stroke-linecap="round"/>
  </g>
  <text x="440" y="355" text-anchor="middle" font-size="24" font-weight="700" fill="#24313a">Tierzelle</text>
</svg>
