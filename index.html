<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Interaktive Simulationen | Schule</title>
  <style>
    :root {
      font-family: system-ui, sans-serif;
      color: #24313a;
      background: #f5f7f8;
    }
    * { box-sizing: border-box; }
    body {
      max-width: 1000px;
      margin: 0 auto;
      padding: 48px 24px;
    }
    header { margin-bottom: 40px; }
    h1 { font-size: 2rem; margin-bottom: 8px; }
    .subtitle { color: #64748b; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
    }
    .card {
      display: block;
      padding: 24px;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      background: white;
      color: inherit;
      text-decoration: none;
      transition: transform .15s, box-shadow .15s;
    }
    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 24px #00000012;
    }
    .card .emoji { font-size: 2.5rem; }
    .card h2 { font-size: 1.2rem; }
    .card p { color: #64748b; line-height: 1.5; }
  </style>
</head>
<body>
  <header>
    <h1>Interaktive Simulationen</h1>
    <p class="subtitle">Entdecken, experimentieren und verstehen.</p>
  </header>

  <main class="grid">
    <a class="card" href="animationen/wassertransport/">
      <div class="emoji">🌳</div>
      <h2>Wassertransport im Baum</h2>
      <p>Entdecke Wurzeldruck, Verdunstungssog,
      Kohäsion und Adhäsion.</p>
    </a>
  </main>
</body>
</html>
